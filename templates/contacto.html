<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Contacto</h2>
        <form action="mailto:silviagrosascol@gmail.com" method="POST" enctype="text/plain">
            <div class="form-group">
                <input type="text" name="Nombre" placeholder="Nombre" required>
            </div>
            <div class="form-group">
                <input type="email" name="Correo" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <textarea name="Mensaje" rows="5" placeholder="Mensaje" required></textarea>
            </div>
            <button type="submit">Enviar mensaje</button>
        </form>
    </div>
</body>
</html>
